[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-structure-analyzer"
version = "0.1.0"
description = "Analyze song structure and label sections as Ap/Dp/S/Cp"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
vocal = ["demucs"]
beat = ["madmom>=0.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_structure_analyzer*"]
