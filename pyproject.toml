[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-structure-analyzer"
version = "0.2.0"
description = "Music structure / beat analysis via all-in-one (harmonix-all)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_structure_analyzer*"]
